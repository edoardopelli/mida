worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 10m;
    server_tokens off;

    # I container vengono ricreati a ogni deploy: nginx deve risolvere di
    # nuovo i nomi dei servizi Docker senza richiedere un proprio restart.
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream mida_backend {
        zone mida_backend 64k;
        server mida-backend:8080 resolve;
    }

    upstream mida_frontend {
        zone mida_frontend 64k;
        server mida-frontend:8080 resolve;
    }

    # Healthcheck interno del container: non è esposto sull'host.
    server {
        listen 8080;
        server_name _;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            return 404;
        }
    }

    server {
        listen 4443 ssl;
        http2 on;
        server_name maximilianclassroom.com www.maximilianclassroom.com;

        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:MIDA_SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # SSE: la connessione resta aperta e non deve essere bufferizzata.
        location = /api/events {
            proxy_pass http://mida_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
            gzip off;
        }

        location /api/ {
            proxy_pass http://mida_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # OpenAPI e Swagger restano dietro lo stesso host/https.
        location ^~ /v3/api-docs {
            proxy_pass http://mida_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;
        }

        location ^~ /swagger-ui/ {
            proxy_pass http://mida_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;
        }

        location = /swagger-ui.html {
            proxy_pass http://mida_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;
        }

        # Tutto il resto è la SPA Angular servita dal container frontend.
        location / {
            proxy_pass http://mida_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_read_timeout 60s;
        }
    }
}
